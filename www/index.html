<!DOCTYPE html>
<html dir="ltr" lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@robustarush/material — dev</title>

  <!-- MD3 design tokens. Active theme is selected via the class on <html>. -->
  <link rel="stylesheet" href="/static/material/theme.css" />

  <!--
    Tailwind utilities + component styles. Same file is also adopted into
    every shadow root by adoptMaterialStyles(). Override the URL per page:
        <meta name="material-stylesheet" content="/some/other/path.css" />
  -->
  <link rel="stylesheet" href="/static/material/material.css" />

  <script type="module" src="/build/material.esm.js"></script>
  <script nomodule src="/build/material.js"></script>
</head>
<body class="bg-background text-on-background p-8 space-y-4">
  <h1 class="text-2xl font-bold">@robustarush/material</h1>
  <p class="text-on-surface-variant">
    Stencil + Tailwind v4 + Material 3 tokens. Switch <code>&lt;html class&gt;</code>
    to <code>dark</code>, <code>light-high-contrast</code>, etc. — the button below follows.
  </p>
  <material-button label="Filled button"></material-button>
</body>
</html>
