<!DOCTYPE html>
<html dir="ltr" lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email — showcase — advanced-material-web</title>

  <link rel="stylesheet" href="/static/material/theme.css" />
  <link rel="stylesheet" href="/static/material/material.css" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <script type="module" src="/build/material.esm.js"></script>
  <script nomodule src="/build/material.js"></script>
</head>

<!--
  Email-app showcase — composes existing material/ components into the canonical
  MD3 list-detail layout for email (foundations/layout-canonical-list-detail).
  Targets expanded windows ≥840dp; resizing narrower will look cramped (compact
  responsive variants are a future showcase). Static — no backend; ~12 sample
  emails are rendered from a JS array.

  Selection model: row click opens the email; checkbox toggles selection
  independently (Gmail-style multi-action). Driven by the list's
  `selection-trigger="control"` mode — row click emits a plain activate
  signal, the checkbox manages its own state via `checkedChange`. When ≥1
  rows are checked, the detail pane shows a multi-select action bar
  (overriding the open email); else it shows the open email or empty state.
-->

<body class="bg-background text-on-background h-screen flex overflow-hidden">

  <!-- Navigation rail — full-height on the leading edge per nav-rail spec.
       Collapsed (96dp) by default; the built-in toggle expands it (title at
       the leading edge, toggle at the trailing edge). modality="auto": below
       640px the rail hides and opens as a modal panel from the app-bar
       hamburger instead.
       Note: FAB is intentionally not nested in the rail here — a 96dp Large FAB
       fills the rail width and looks oversized. The compose FAB lives fixed in
       the lower-trailing corner of the content area instead (Gmail-style). -->
  <material-navigation-rail id="rail" class="shrink-0" label="Mail"
                            modality="auto" breakpoint="640">

    <material-navigation-item icon="inbox" label="Inbox" active aria-label="Inbox, 4 unread">
      <material-badge slot="badge" value="4"></material-badge>
    </material-navigation-item>
    <material-navigation-item icon="star" label="Starred"></material-navigation-item>
    <material-navigation-item icon="schedule" label="Snoozed"></material-navigation-item>
    <material-navigation-item icon="send" label="Sent"></material-navigation-item>
    <material-navigation-item icon="drafts" label="Drafts" aria-label="Drafts, 2">
      <material-badge slot="badge" value="2"></material-badge>
    </material-navigation-item>
    <material-divider inset="middle"></material-divider>
    <material-navigation-item icon="archive" label="Archive"></material-navigation-item>
    <material-navigation-item icon="delete" label="Trash"></material-navigation-item>
    <material-navigation-item icon="settings" slot="bottom" label="Settings"></material-navigation-item>
  </material-navigation-rail>

  <div class="flex-1 flex flex-col min-w-0">

    <!-- Search app bar — sits above content panes only. The hamburger in
         `leading` shows only on compact viewports, where the rail is hidden
         and opens as a modal panel. -->
    <material-search-app-bar id="search" placeholder="Search mail" class="shrink-0">
      <material-icon-button id="rail-open" slot="leading" variant="standard"
                            icon="menu" aria-label="Open navigation"
                            class="sm:hidden"></material-icon-button>
      <select id="theme-picker" slot="trailing"
              class="bg-surface-container text-on-surface border border-outline-variant rounded px-2 py-1 text-xs mr-1"
              aria-label="Theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="light-medium-contrast">Light · medium contrast</option>
        <option value="dark-medium-contrast">Dark · medium contrast</option>
        <option value="light-high-contrast">Light · high contrast</option>
        <option value="dark-high-contrast">Dark · high contrast</option>
      </select>
      <div data-density-picker slot="trailing" role="group" aria-label="Density"
           class="inline-flex bg-surface-container-low border border-outline-variant rounded overflow-hidden mr-1">
        <button type="button" data-density="0.8" aria-pressed="false"
                class="px-2 py-1 text-xs aria-pressed:bg-secondary-container aria-pressed:text-on-secondary-container">A−</button>
        <button type="button" data-density="0.9" aria-pressed="false"
                class="px-2 py-1 text-xs aria-pressed:bg-secondary-container aria-pressed:text-on-secondary-container">A</button>
        <button type="button" data-density="1" aria-pressed="false"
                class="px-2 py-1 text-xs aria-pressed:bg-secondary-container aria-pressed:text-on-secondary-container">A+</button>
      </div>
      <span slot="trailing"
            class="w-9 h-9 mr-2 rounded-full bg-tertiary text-on-tertiary inline-flex items-center justify-center text-sm font-medium"
            title="Mikhail Podgurskiy"
            aria-label="Account">MP</span>
    </material-search-app-bar>

    <!-- List-detail content: 360dp fixed list + flex detail, 24dp side margins + spacer per expanded layout spec.
         Top padding is tightened (4px) so the list pane top aligns with the rail's first nav item. -->
    <main class="flex-1 grid grid-cols-[360px_1fr] gap-6 px-6 pt-1 pb-6 min-h-0">

      <section class="min-h-0 flex flex-col rounded-2xl bg-surface-container-low border border-outline-variant overflow-hidden">
        <header class="px-4 py-3 border-b border-outline-variant flex items-center justify-between gap-2 shrink-0">
          <h2 class="text-title-medium font-semibold">Inbox</h2>
          <span class="text-on-surface-variant text-body-small" id="list-count">12 messages</span>
        </header>
        <!-- activation="auto": the list keeps the opened row highlighted. The
             page tracks activeId itself for the detail pane, but nothing here
             writes `active` back onto the row. -->
        <material-list id="emails" aria-label="Messages" selection="multi" selection-trigger="control"
                       activation="auto" variant="expressive"
                       class="flex-1 overflow-y-auto py-2"></material-list>
      </section>

      <section id="detail" class="min-h-0 overflow-y-auto"></section>

    </main>
  </div>

  <!-- Compose FAB — fixed in lower-trailing corner with 24dp inset (matches expanded-layout margins).
       Medium size (80dp) — per FAB guidelines: "Most situations — compact and medium windows". -->
  <material-fab class="fixed bottom-6 right-6 z-10"
                size="medium" variant="primary-container"
                icon="edit" aria-label="Compose"
                onclick="document.getElementById('compose').show()"></material-fab>

  <!-- Compose dialog -->
  <material-dialog id="compose" headline="New message">
    <form id="compose-form" class="grid gap-4 w-[min(640px,80vw)]">
      <material-textfield label="To" name="to" required class="w-full"></material-textfield>
      <material-textfield label="Subject" name="subject" class="w-full"></material-textfield>
      <material-textarea label="Message" name="body" rows="10" class="w-full"></material-textarea>
    </form>
    <div slot="actions">
      <material-button variant="text" label="Discard" data-dialog-close></material-button>
      <material-button variant="filled" label="Send" data-dialog-close="send"></material-button>
    </div>
  </material-dialog>

  <!-- Detail-pane "more" menu — anchors to whichever popovertarget invoker opens it -->
  <material-menu id="more-menu" placement="bottom-end">
    <material-menu-item value="spam" label="Mark as spam" leading-icon="report"></material-menu-item>
    <material-menu-item value="label" label="Add label…" leading-icon="label"></material-menu-item>
    <material-menu-item value="print" label="Print" leading-icon="print"></material-menu-item>
    <material-menu-item value="block" label="Block sender" leading-icon="block" divider="top"></material-menu-item>
  </material-menu>

  <material-snackbar-host placement="bottom"></material-snackbar-host>

  <script src="/demos/_shared.js"></script>
  <script>
    // ─── Sample data ──────────────────────────────────────────────────────
    const EMAILS = [
      { id: 'm-001', sender: 'Anna Petersen',   initials: 'AP', avatar: 'primary',
        subject: 'Re: design spec review',
        preview: "Let's sync tomorrow at 10am to walk through the latest mockups — I have some thoughts on the navigation rail expansion behavior.",
        time: '10:42 AM', unread: true },
      { id: 'm-002', sender: 'Robert Chen',     initials: 'RC', avatar: 'secondary',
        subject: 'Invoice #2026-0142 attached',
        preview: 'Please find attached the invoice for April. Payment due May 15th — let me know if you need anything else.',
        time: '9:18 AM', unread: true },
      { id: 'm-003', sender: 'Carol Diaz',      initials: 'CD', avatar: 'tertiary',
        subject: 'Lunch this Thursday?',
        preview: 'Free Thursday around noon? Was thinking we could try that new ramen place near the office.',
        time: '8:55 AM', unread: true },
      { id: 'm-004', sender: 'Material Design', initials: 'MD', avatar: 'primary-container',
        subject: 'New components in MD3 Expressive',
        preview: 'Check out the latest additions: split-button, FAB-menu, and updated navigation rail with expandable variants.',
        time: 'Yesterday', unread: false },
      { id: 'm-005', sender: 'Dmitri Volkov',   initials: 'DV', avatar: 'secondary-container',
        subject: 'Approved: Q2 budget request',
        preview: 'Your Q2 request for tooling and infra has been approved. Watch for the formal allocation memo.',
        time: 'Yesterday', unread: true },
      { id: 'm-006', sender: 'GitHub',          initials: 'GH', avatar: 'tertiary-container',
        subject: '[robusta/material] PR #142 ready for review',
        preview: 'Mikhail Podgurskiy requested your review on "feat: add material-snackbar component"',
        time: 'Yesterday', unread: false },
      { id: 'm-007', sender: 'Elena Marquez',   initials: 'EM', avatar: 'primary',
        subject: 'Conference talk proposal',
        preview: 'Pulled together the abstract for the Material adoption talk — would love your eyes before submission Friday.',
        time: 'Wed', unread: false },
      { id: 'm-008', sender: 'Frank Lin',       initials: 'FL', avatar: 'secondary',
        subject: 'Re: API rate limits',
        preview: 'New caching layer should help, but we should still bump the burst limit to 200/min for the dashboard.',
        time: 'Wed', unread: false },
      { id: 'm-009', sender: 'HR · Robusta',    initials: 'HR', avatar: 'tertiary',
        subject: 'Reminder: benefits enrollment closes May 12',
        preview: 'A few people still have not enrolled — links inside. The whole thing takes about 5 minutes.',
        time: 'Tue', unread: false },
      { id: 'm-010', sender: 'Grace Patel',     initials: 'GP', avatar: 'primary-container',
        subject: 'Welcome aboard 🎉',
        preview: 'So happy to have you on the team. Calendar invite coming for an onboarding 1:1 next week.',
        time: 'Mon', unread: false },
      { id: 'm-011', sender: 'Stripe',          initials: 'ST', avatar: 'secondary-container',
        subject: 'Your receipt from Robusta Coffee',
        preview: 'Amount $14.20 charged to •••• 4242. View receipt for itemized list.',
        time: 'Apr 28', unread: false },
      { id: 'm-012', sender: 'Hannah Mori',     initials: 'HM', avatar: 'tertiary-container',
        subject: 'Vacation photos!',
        preview: 'Finally got around to sorting through the Iceland trip — link to the album below. Some real keepers.',
        time: 'Apr 27', unread: false },
    ];

    // Map each avatar variant to its on-* text color for tailwind class composition.
    const ON = {
      'primary': 'on-primary', 'secondary': 'on-secondary', 'tertiary': 'on-tertiary',
      'primary-container': 'on-primary-container',
      'secondary-container': 'on-secondary-container',
      'tertiary-container': 'on-tertiary-container',
    };

    // ─── Render email list ───────────────────────────────────────────────
    const list = document.getElementById('emails');
    list.innerHTML = EMAILS.map((e, i) => `
      <material-list-item value="${e.id}"
                          supporting-text="${e.subject} — ${e.preview}"
                          ${i > 0 ? 'divider="top"' : ''}><material-checkbox slot="leading" aria-label="Select"></material-checkbox><span slot="leading" class="ml-2 w-10 h-10 rounded-full bg-${e.avatar} text-${ON[e.avatar]} inline-flex items-center justify-center text-sm font-medium" aria-hidden="true">${e.initials}</span><span class="${e.unread ? 'font-semibold' : ''}">${e.sender}</span><span slot="trailing" class="text-xs text-on-surface-variant whitespace-nowrap">${e.time}</span>${e.unread ? '<material-badge slot="trailing" aria-label="unread"></material-badge>' : ''}</material-list-item>
    `).join('');

    // ─── Detail pane templates ───────────────────────────────────────────
    const detail = document.getElementById('detail');
    const host   = document.querySelector('material-snackbar-host');

    function emptyState() {
      return `
        <div class="h-full flex flex-col items-center justify-center text-center px-8 text-on-surface-variant">
          <span class="material-symbols text-6xl mb-4 opacity-40" aria-hidden="true">drafts</span>
          <h2 class="text-title-large font-medium text-on-surface mb-1">Select a conversation</h2>
          <p class="text-body-medium max-w-sm">Pick a message from your inbox to read it, or tick checkboxes to act on multiple at once.</p>
        </div>`;
    }

    function emailView(e) {
      const onColor = ON[e.avatar];
      return `
        <article class="rounded-2xl bg-surface-container-low border border-outline-variant overflow-hidden">
          <header class="flex items-center gap-1 px-3 py-2 border-b border-outline-variant">
            <material-icon-button icon="arrow_back" variant="standard" aria-label="Back to inbox"
                                  data-action="back"></material-icon-button>
            <div class="flex-1"></div>
            <material-icon-button icon="archive" variant="standard" aria-label="Archive"
                                  data-action="archive" data-id="${e.id}"></material-icon-button>
            <material-icon-button icon="delete" variant="standard" aria-label="Delete"
                                  data-action="delete" data-id="${e.id}"></material-icon-button>
            <material-icon-button icon="mark_email_unread" variant="standard" aria-label="Mark unread"
                                  data-action="mark-unread" data-id="${e.id}"></material-icon-button>
            <material-icon-button icon="more_vert" variant="standard" aria-label="More"
                                  popovertarget="more-menu"></material-icon-button>
          </header>
          <div class="px-6 py-5">
            <h1 class="text-headline-medium font-semibold mb-4">${e.subject}</h1>
            <div class="flex items-center gap-3 mb-6">
              <span class="w-10 h-10 rounded-full bg-${e.avatar} text-${onColor} inline-flex items-center justify-center text-sm font-medium">${e.initials}</span>
              <div class="flex-1 min-w-0">
                <div class="text-body-large font-medium truncate">${e.sender}</div>
                <div class="text-body-small text-on-surface-variant truncate">to me · ${e.time}</div>
              </div>
              <material-icon-button icon="reply" variant="standard" aria-label="Reply"></material-icon-button>
              <material-icon-button icon="reply_all" variant="standard" aria-label="Reply all"></material-icon-button>
              <material-icon-button icon="forward" variant="standard" aria-label="Forward"></material-icon-button>
            </div>
            <div class="text-body-medium space-y-4 text-on-surface leading-relaxed">
              <p>Hi,</p>
              <p>${e.preview}</p>
              <p>This is a static showcase, so the body content is short — but it gives a sense of how the detail pane would render real email content using MD3 typography utilities on a card surface.</p>
              <p>Click another email in the list to swap this view, or tick checkboxes to enter multi-select mode.</p>
              <p class="pt-2 text-on-surface-variant">— ${e.sender.split(' ')[0]}</p>
            </div>
          </div>
        </article>`;
    }

    function selectionBar(count) {
      return `
        <div class="rounded-2xl bg-secondary-container text-on-secondary-container border border-outline-variant px-3 py-2 flex items-center gap-2">
          <material-icon-button icon="close" variant="standard" aria-label="Clear selection"
                                data-action="clear"></material-icon-button>
          <span class="font-medium ml-1">${count} selected</span>
          <div class="flex-1"></div>
          <material-icon-button icon="archive" variant="standard" aria-label="Archive"
                                data-action="bulk-archive"></material-icon-button>
          <material-icon-button icon="delete" variant="standard" aria-label="Delete"
                                data-action="bulk-delete"></material-icon-button>
          <material-icon-button icon="mark_email_unread" variant="standard" aria-label="Mark unread"
                                data-action="bulk-mark-unread"></material-icon-button>
        </div>
        <div class="mt-8 text-center text-on-surface-variant text-body-medium">
          Multi-select mode — pick an action above, or clear to read.
        </div>`;
    }

    // ─── Detail-pane state ──────────────────────────────────────────────
    // Two independent signals drive what the detail pane shows:
    //   activeId  — last email opened via row click
    //   selected  — set of items with their leading checkbox ticked
    // Selection (when non-empty) overrides the open email and shows the
    // multi-select action bar.
    let activeId = null;
    const selected = new Set();

    function refreshDetail() {
      if (selected.size > 0) {
        detail.innerHTML = selectionBar(selected.size);
      } else if (activeId) {
        const email = EMAILS.find(x => x.id === activeId);
        detail.innerHTML = email ? emailView(email) : emptyState();
      } else {
        detail.innerHTML = emptyState();
      }
    }
    refreshDetail();

    // Row click → open the email (selection-trigger="control" means the row
    // emits an activate signal without touching the leading checkbox).
    list.addEventListener('materialListSelect', (e) => {
      activeId = e.detail.value ?? null;
      refreshDetail();
    });

    // Checkbox toggle → manage selection independently. The leading checkbox
    // emits `checkedChange` when its state changes (via click or keyboard).
    list.addEventListener('checkedChange', (e) => {
      const cb = e.target;
      if (!cb || cb.tagName.toLowerCase() !== 'material-checkbox') return;
      const item = cb.closest('material-list-item');
      if (!item) return;
      const value = item.getAttribute('value');
      if (e.detail.checked) {
        selected.add(value);
        item.selected = true;
      } else {
        selected.delete(value);
        item.selected = false;
      }
      refreshDetail();
    });

    // ─── Action handlers (delegated from detail pane) ───────────────────
    function clearSelection() {
      list.querySelectorAll('material-list-item').forEach(item => {
        if (!item.selected) return;
        item.selected = false;
        const cb = item.querySelector('material-checkbox[slot="leading"]');
        if (cb) cb.checked = false;
      });
      selected.clear();
    }

    function removeRow(id) {
      const row = list.querySelector(`material-list-item[value="${id}"]`);
      if (row) row.remove();
      selected.delete(id);
      if (activeId === id) activeId = null;
      const count = list.querySelectorAll('material-list-item').length;
      document.getElementById('list-count').textContent =
        `${count} message${count !== 1 ? 's' : ''}`;
    }

    function markUnread(id) {
      const row = list.querySelector(`material-list-item[value="${id}"]`);
      if (row && !row.querySelector('material-badge[slot="trailing"]')) {
        const dot = document.createElement('material-badge');
        dot.setAttribute('slot', 'trailing');
        dot.setAttribute('aria-label', 'unread');
        row.appendChild(dot);
      }
    }

    detail.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-action');
      const id = btn.getAttribute('data-id');

      if (action === 'back') {
        activeId = null;
        refreshDetail();
        return;
      }
      if (action === 'clear') {
        clearSelection();
        refreshDetail();
        return;
      }
      if (action === 'archive') {
        removeRow(id);
        host.enqueue({ message: 'Conversation archived.', actionLabel: 'Undo' });
        refreshDetail();
      }
      if (action === 'delete') {
        removeRow(id);
        host.enqueue({ message: 'Moved to Trash.', actionLabel: 'Undo' });
        refreshDetail();
      }
      if (action === 'mark-unread') {
        markUnread(id);
        activeId = null;
        host.enqueue({ message: 'Marked as unread.' });
        refreshDetail();
      }
      if (action === 'bulk-archive') {
        const n = selected.size;
        [...selected].forEach(removeRow);
        clearSelection();
        host.enqueue({ message: `${n} conversation${n>1?'s':''} archived.`, actionLabel: 'Undo' });
        refreshDetail();
      }
      if (action === 'bulk-delete') {
        const n = selected.size;
        [...selected].forEach(removeRow);
        clearSelection();
        host.enqueue({ message: `${n} conversation${n>1?'s':''} moved to Trash.`, actionLabel: 'Undo' });
        refreshDetail();
      }
      if (action === 'bulk-mark-unread') {
        [...selected].forEach(markUnread);
        clearSelection();
        host.enqueue({ message: 'Marked as unread.' });
        refreshDetail();
      }
    });

    // ─── Compose dialog ─────────────────────────────────────────────────
    const compose = document.getElementById('compose');
    const composeForm = document.getElementById('compose-form');
    compose.addEventListener('materialDialogClose', (e) => {
      if (e.detail.returnValue === 'send') {
        host.enqueue({ message: 'Email sent.' });
      }
      composeForm.reset();
    });

    // ─── More menu ──────────────────────────────────────────────────────
    document.getElementById('more-menu').addEventListener('materialMenuSelect', (e) => {
      host.enqueue({ message: `Action: ${e.detail.value}` });
    });

    // ─── Navigation rail (compact viewports) ────────────────────────────
    // Below 640px the rail hides (modality="auto"); the app-bar hamburger
    // opens it as a modal panel.
    document.getElementById('rail-open').addEventListener('click',
      () => document.getElementById('rail').expand());
  </script>
</body>
</html>
